name: RayTracer
options:
  bundleIdPrefix: com.gzonelee
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 서명 설정은 생성물(.xcodeproj) 바깥에 둔다.
# xcconfig 는 XcodeGen 이 건드리지 않으므로 `make project` 를 해도 살아남는다.
# 반대로 아래 settings 나 Xcode UI 에서 고른 값은 생성할 때마다 날아간다
# (pbxproj 의 빌드 설정이 xcconfig 보다 우선하므로, DEVELOPMENT_TEAM 은 여기 두면 안 된다).
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: RayTracer/RayTracer-Bridging-Header.h
    MTL_HEADER_SEARCH_PATHS: $(SRCROOT)/RayTracer
    MTL_LANGUAGE_REVISION: Metal30   # iOS 16 / macOS 13 에 맞춘다. Metal31 은 iOS 17+ 전용이라 구형 OS 에서 라이브러리 로드가 실패한다
    MTL_FAST_MATH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM / BUNDLE_ID_PREFIX 는 Local.xcconfig 에 있다 (`make team` 으로 설정)

fileGroups:
  - project.yml
  - README.md

targets:
  RayTracer-iOS:
    type: application
    platform: iOS
    sources:
      - path: RayTracer
        excludes: ["*.md"]
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: RayTracer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        # 저장 버튼이 사진 앱에 쓰기만 한다 (읽기 권한은 요청하지 않음)
        NSPhotoLibraryAddUsageDescription: 렌더링한 이미지를 사진 앱에 저장합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).RayTracer
        TARGETED_DEVICE_FAMILY: "1,2"

  RayTracer-macOS:
    type: application
    platform: macOS
    sources:
      - path: RayTracer
        excludes: ["*.md"]
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: RayTracer
        LSMinimumSystemVersion: "13.0"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).RayTracer
        # 샌드박스 없이 로컬 실행 (필요해지면 entitlements 추가)
        ENABLE_HARDENED_RUNTIME: NO
